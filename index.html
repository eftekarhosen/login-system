<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login System</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
    }

    .card {
      width: 100%;
      max-width: 420px;
      padding: 40px;
      background: white;
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(0,0,0,.1);
    }

    .logo {
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      margin-bottom: 25px;
      border-radius: 14px;
      color: white;
      background: linear-gradient(135deg,#00A4FF,#2D7DFF);
      font-weight: bold;
      font-size: 20px;
    }

    .eyebrow {
      color: #2D7DFF;
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 2px;
      margin-bottom: 8px;
    }

    h1 {
      font-size: 30px;
      color: #111827;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #667085;
      font-size: 14px;
      margin-bottom: 28px;
    }

    label {
      display: block;
      margin: 18px 0 8px;
      font-size: 13px;
      font-weight: 600;
      color: #344054;
    }

    input[type="email"],
    input[type="password"],
    input[type="text"] {
      width: 100%;
      height: 50px;
      padding: 0 14px;
      border: 1px solid #d9e0ea;
      border-radius: 12px;
      outline: none;
      font-size: 14px;
    }

    input:focus {
      border-color: #2D7DFF;
      box-shadow: 0 0 0 4px rgba(45,125,255,.1);
    }

    .password {
      position: relative;
    }

    .password input {
      padding-right: 65px;
    }

    .show {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      border: 0;
      background: none;
      color: #2D7DFF;
      font-weight: bold;
      cursor: pointer;
    }

    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 16px 0 22px;
      font-size: 12px;
    }

    .remember {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #667085;
    }

    a {
      color: #2D7DFF;
      text-decoration: none;
      font-weight: 600;
    }

    .login {
      width: 100%;
      height: 50px;
      border: 0;
      border-radius: 12px;
      color: white;
      background: linear-gradient(135deg,#00A4FF,#2D7DFF);
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .signup {
      margin-top: 25px;
      text-align: center;
      color: #667085;
      font-size: 12px;
    }

    #message {
      margin-top: 12px;
      text-align: center;
      font-size: 12px;
    }

    @media (max-width: 480px) {
      .card {
        padding: 28px 22px;
      }

      h1 {
        font-size: 26px;
      }
    }
  </style>
</head>

<body>

  <main class="card">

    <div class="logo">E</div>

    <p class="eyebrow">WELCOME BACK</p>

    <h1>Sign in to your account</h1>

    <p class="subtitle">
      Enter your details to continue.
    </p>

    <form id="loginForm">

      <label>Email address</label>

      <input
        type="email"
        id="email"
        placeholder="you@example.com"
      >

      <label>Password</label>

      <div class="password">
        <input
          type="password"
          id="password"
          placeholder="Enter your password"
        >

        <button
          type="button"
          class="show"
          id="showPassword"
        >
          Show
        </button>
      </div>

      <div class="row">

        <label class="remember">
          <input type="checkbox">
          Remember me
        </label>

        <a href="#">Forgot password?</a>

      </div>

      <button class="login" type="submit">
        Sign in
      </button>

      <p id="message"></p>

    </form>

    <p class="signup">
      Don't have an account?
      <a href="#">Create account</a>
    </p>

  </main>

  <script>

    const password = document.getElementById("password");
    const showPassword = document.getElementById("showPassword");
    const form = document.getElementById("loginForm");
    const message = document.getElementById("message");

    showPassword.onclick = function() {

      if (password.type === "password") {
        password.type = "text";
        showPassword.textContent = "Hide";
      } else {
        password.type = "password";
        showPassword.textContent = "Show";
      }

    };

    form.onsubmit = function(event) {

      event.preventDefault();

      const email = document.getElementById("email").value;

      if (!email || !password.value) {
        message.style.color = "#D92D20";
        message.textContent = "Please enter email and password.";
        return;
      }

      message.style.color = "#12B76A";
      message.textContent = "Form is ready for Supabase authentication.";

    };

  </script>

</body>
</html>
