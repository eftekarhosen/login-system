<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login System</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
    }

    .card {
      width: 100%;
      max-width: 420px;
      padding: 35px;
      background: white;
      border-radius: 22px;
      box-shadow: 0 20px 60px rgba(0,0,0,.1);
    }

    .logo {
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      margin-bottom: 22px;
      border-radius: 14px;
      color: white;
      background: linear-gradient(135deg,#00A4FF,#2D7DFF);
      font-weight: bold;
      font-size: 20px;
    }

    .eyebrow {
      color: #2D7DFF;
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    h1 {
      margin: 8px 0;
      color: #111827;
      font-size: 28px;
    }

    .subtitle {
      color: #667085;
      font-size: 14px;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin: 16px 0 7px;
      color: #344054;
      font-size: 13px;
      font-weight: 600;
    }

    input {
      width: 100%;
      height: 50px;
      padding: 0 14px;
      border: 1px solid #d9e0ea;
      border-radius: 12px;
      outline: none;
      font-size: 14px;
    }

    input:focus {
      border-color: #2D7DFF;
      box-shadow: 0 0 0 4px rgba(45,125,255,.1);
    }

    .password {
      position: relative;
    }

    .password input {
      padding-right: 65px;
    }

    .show {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      border: 0;
      background: none;
      color: #2D7DFF;
      font-weight: bold;
    }

    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 15px 0 20px;
      font-size: 12px;
    }

    .remember {
      margin: 0;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .remember input {
      width: auto;
      height: auto;
    }

    a {
      color: #2D7DFF;
      text-decoration: none;
      font-weight: 600;
    }

    .login {
      width: 100%;
      height: 50px;
      border: 0;
      border-radius: 12px;
      color: white;
      background: linear-gradient(135deg,#00A4FF,#2D7DFF);
      font-size: 15px;
      font-weight: bold;
    }

    .login:disabled {
      opacity: .6;
    }

    #message {
      min-height: 18px;
      margin-top: 12px;
      text-align: center;
      font-size: 12px;
    }

    .signup {
      margin-top: 22px;
      text-align: center;
      color: #667085;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <main class="card">

    <div class="logo">E</div>

    <div class="eyebrow">WELCOME BACK</div>

    <h1>Sign in to your account</h1>

    <p class="subtitle">
      Enter your details to continue.
    </p>

    <form id="loginForm">

      <label>Email address</label>

      <input
        id="email"
        type="email"
        placeholder="you@example.com"
        required
      >

      <label>Password</label>

      <div class="password">

        <input
          id="password"
          type="password"
          placeholder="Enter your password"
          required
        >

        <button
          type="button"
          class="show"
          id="showPassword"
        >
          Show
        </button>

      </div>

      <div class="row">

        <label class="remember">
          <input type="checkbox">
          Remember me
        </label>

        <a href="#">Forgot password?</a>

      </div>

      <button
        class="login"
        id="loginButton"
        type="submit"
      >
        Sign in
      </button>

      <p id="message"></p>

    </form>

    <p class="signup">
      Don't have an account?
      <a href="signup.html">Create account</a>
    </p>

  </main>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    const supabaseClient =
      window.supabase.createClient(
        "https://ivgvutsvtmwzoxuhijhi.supabase.co",
        "sb_publishable_n27G40Ccbw2vyU8DsX0yuw_yo-sRodl"
      );


    const form =
      document.getElementById("loginForm");

    const password =
      document.getElementById("password");

    const message =
      document.getElementById("message");

    const loginButton =
      document.getElementById("loginButton");


    document.getElementById("showPassword").onclick =
      function () {

        if (password.type === "password") {

          password.type = "text";
          this.textContent = "Hide";

        } else {

          password.type = "password";
          this.textContent = "Show";

        }

      };


    form.onsubmit = async function (event) {

      event.preventDefault();

      const email =
        document.getElementById("email").value.trim();

      const passwordValue =
        password.value;


      message.style.color = "#667085";
      message.textContent = "Signing in...";

      loginButton.disabled = true;


      const { data, error } =
        await supabaseClient.auth.signInWithPassword({

          email: email,
          password: passwordValue

        });


      loginButton.disabled = false;


      if (error) {

        message.style.color = "#D92D20";
        message.textContent = error.message;

        return;
      }


      message.style.color = "#12B76A";

      window.location.href = "dashboard.html";

      console.log(data.user);

    };

  </script>

</body>
</html>
