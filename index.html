<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login System</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
    }

    .card {
      width: 100%;
      max-width: 420px;
      padding: 40px;
      background: white;
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(0,0,0,.1);
    }

    .logo {
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      margin-bottom: 25px;
      border-radius: 14px;
      color: white;
      background: linear-gradient(135deg,#00A4FF,#2D7DFF);
      font-weight: bold;
      font-size: 20px;
    }

    .eyebrow {
      color: #2D7DFF;
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 2px;
      margin-bottom: 8px;
    }

    h1 {
      font-size: 30px;
      color: #111827;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #667085;
      font-size: 14px;
      margin-bottom: 28px;
    }

    label {
      display: block;
      margin: 18px 0 8px;
      font-size: 13px;
      font-weight: 600;
      color: #344054;
    }

    input[type="email"],
    input[type="password"] {
      width: 100%;
      height: 50px;
      padding: 0 14px;
      border: 1px solid #d9e0ea;
      border-radius: 12px;
      outline: none;
      font-size: 14px;
    }

    input:focus {
      border-color: #2D7DFF;
      box-shadow: 0 0 0 4px rgba(45,125,255,.1);
    }

    .password {
      position: relative;
    }

    .password input {
      padding-right: 65px;
    }

    .show {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      border: 0;
      background: none;
      color: #2D7DFF;
      font-weight: bold;
      cursor: pointer;
    }

    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 16px 0 22px;
      font-size: 12px;
    }

    .remember {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #667085;
      margin: 0;
    }

    .remember input {
      width: auto;
    }

    a {
      color: #2D7DFF;
      text-decoration: none;
      font-weight: 600;
    }

      height: 50px;
