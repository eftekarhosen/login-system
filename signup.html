<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Create Account</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
    }

    .card {
      width: 100%;
      max-width: 420px;
      padding: 40px;
      background: white;
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(0,0,0,.1);
    }

    .logo {
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      margin-bottom: 25px;
      border-radius: 14px;
      color: white;
      background: linear-gradient(135deg,#00A4FF,#2D7DFF);
      font-weight: bold;
      font-size: 20px;
    }

    .eyebrow {
      color: #2D7DFF;
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 2px;
      margin-bottom: 8px;
    }

    h1 {
      font-size: 30px;
      color: #111827;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #667085;
      font-size: 14px;
      margin-bottom: 28px;
    }

    label {
      display: block;
      margin: 18px 0 8px;
      font-size: 13px;
      font-weight: 600;
      color: #344054;
    }

    input {
      width: 100%;
      height: 50px;
      padding: 0 14px;
      border: 1px solid #d9e0ea;
      border-radius: 12px;
      outline: none;
      font-size: 14px;
    }

    input:focus {
      border-color: #2D7DFF;
      box-shadow: 0 0 0 4px rgba(45,125,255,.1);
    }

    .password {
      position: relative;
    }

    .password input {
      padding-right: 65px;
    }

    .show {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      border: 0;
      background: none;
      color: #2D7DFF;
      font-weight: bold;
      cursor: pointer;
    }

    .signup-btn {
      width: 100%;
      height: 50px;
      margin-top: 24px;
      border: 0;
      border-radius: 12px;
      color: white;
      background: linear-gradient(135deg,#00A4FF,#2D7DFF);
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .signup-btn:disabled {
      opacity: .65;
      cursor: not-allowed;
    }

    #message {
      margin-top: 12px;
      text-align: center;
      font-size: 12px;
      min-height: 16px;
    }

    .login-link {
      margin-top: 25px;
      text-align: center;
      color: #667085;
      font-size: 12px;
    }

    a {
      color: #2D7DFF;
      text-decoration: none;
      font-weight: 600;
    }

    @media (max-width: 480px) {
      .card {
        padding: 28px 22px;
      }

      h1 {
        font-size: 26px;
      }
    }
  </style>
</head>

<body>

  <main class="card">

    <div class="logo">E</div>

    <p class="eyebrow">GET STARTED</p>

    <h1>Create your account</h1>

    <p class="subtitle">
      Create an account to get started.
    </p>

    <form id="signupForm">

      <label for="email">Email address</label>

      <input
        type="email"
        id="email"
        placeholder="you@example.com"
        autocomplete="email"
        required
      >

      <label for="password">Password</label>

      <div class="password">

        <input
          type="password"
          id="password"
          placeholder="Create a password"
          autocomplete="new-password"
          required
        >

        <button
          type="button"
          class="show"
          id="showPassword"
        >
          Show
        </button>

      </div>

      <label for="confirmPassword">Confirm password</label>

      <div class="password">

        <input
          type="password"
          id="confirmPassword"
          placeholder="Confirm your password"
          autocomplete="new-password"
          required
        >

        <button
          type="button"
          class="show"
          id="showConfirmPassword"
        >
          Show
        </button>

      </div>

      <button
        class="signup-btn"
        id="signupButton"
        type="submit"
      >
        Create account
      </button>

      <p id="message"></p>

    </form>

    <p class="login-link">
      Already have an account?
      <a href="index.html">Sign in</a>
    </p>

  </main>
