<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:20px;
  font-family:Arial,sans-serif;
  background:#f5f7fb
}
.card{
  width:100%;
  max-width:420px;
  padding:35px;
  background:white;
  border-radius:22px;
  box-shadow:0 20px 60px rgba(0,0,0,.1)
}
.logo{
  width:48px;
  height:48px;
  display:grid;
  place-items:center;
  margin-bottom:22px;
  border-radius:14px;
  color:white;
  background:linear-gradient(135deg,#00A4FF,#2D7DFF);
  font-weight:bold;
  font-size:20px
}
.eyebrow{
  color:#2D7DFF;
  font-size:11px;
  font-weight:bold;
  letter-spacing:2px
}
h1{
  margin:8px 0;
  color:#111827;
  font-size:28px
}
.subtitle{
  color:#667085;
  font-size:14px;
  margin-bottom:25px
}
label{
  display:block;
  margin:16px 0 7px;
  color:#344054;
  font-size:13px;
  font-weight:600
}
input{
  width:100%;
  height:50px;
  padding:0 14px;
  border:1px solid #d9e0ea;
  border-radius:12px;
  outline:none;
  font-size:14px
}
input:focus{
  border-color:#2D7DFF;
  box-shadow:0 0 0 4px rgba(45,125,255,.1)
}
button{
  width:100%;
  height:50px;
  margin-top:22px;
  border:0;
  border-radius:12px;
  color:white;
  background:linear-gradient(135deg,#00A4FF,#2D7DFF);
  font-size:15px;
  font-weight:bold
}
button:disabled{opacity:.6}
#message{
  min-height:20px;
  margin-top:12px;
  text-align:center;
  font-size:12px
}
.login{
  margin-top:22px;
  text-align:center;
  color:#667085;
  font-size:12px
}
a{
  color:#2D7DFF;
  text-decoration:none;
  font-weight:bold
}
</style>
</head>

<body>

<main class="card">

<div class="logo">E</div>

<div class="eyebrow">GET STARTED</div>

<h1>Create your account</h1>

<p class="subtitle">
Create an account to get started.
</p>

<form id="signupForm">

<label>Email address</label>

<input
id="email"
type="email"
placeholder="you@example.com"
required
>

<label>Password</label>

<input
id="password"
type="password"
placeholder="Create a password"
required
>

<label>Confirm password</label>

<input
id="confirmPassword"
type="password"
placeholder="Confirm your password"
required
>

<button id="signupButton" type="submit">
Create account
</button>

<p id="message"></p>

</form>

<div class="login">
Already have an account?
<a href="index.html">Sign in</a>
</div>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const supabaseClient =
window.supabase.createClient(
"https://ivgvutsvtmwzoxuhijhi.supabase.co",
"sb_publishable_n27G40Ccbw2vyU8DsX0yuw_yo-sRodl"
);

const form =
document.getElementById("signupForm");

const message =
document.getElementById("message");

const button =
document.getElementById("signupButton");

form.onsubmit = async function(event){

event.preventDefault();

const email =
document.getElementById("email").value.trim();

const password =
document.getElementById("password").value;

const confirmPassword =
document.getElementById("confirmPassword").value;

if(password !== confirmPassword){

message.style.color="#D92D20";
message.textContent="Passwords do not match.";
return;

}

if(password.length < 6){

message.style.color="#D92D20";
message.textContent="Password must be at least 6 characters.";
return;

}

message.style.color="#667085";
message.textContent="Creating account...";

button.disabled=true;

const {data,error} =
await supabaseClient.auth.signUp({
email:email,
password:password
});

button.disabled=false;

if(error){

message.style.color="#D92D20";
message.textContent=error.message;
return;

}

message.style.color="#12B76A";

message.textContent =
"Account created! Check your email to verify your account.";

console.log(data);

};

</script>

</body>
</html>
