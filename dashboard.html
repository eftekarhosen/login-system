<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Dashboard</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
    }

    .card {
      width: 90%;
      max-width: 450px;
      padding: 35px;
      background: white;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0,0,0,.1);
    }

    h1 {
      color: #111827;
    }

    #userEmail {
      margin: 20px 0;
      padding: 15px;
      background: #f5f7fb;
      border-radius: 12px;
    }

    button {
      width: 100%;
      height: 50px;
      border: 0;
      border-radius: 12px;
      background: #D92D20;
      color: white;
      font-weight: bold;
      font-size: 15px;
    }
  </style>
</head>

<body>

  <div class="card">

    <h1>Welcome 🎉</h1>

    <p>You are logged in successfully.</p>

    <div id="userEmail">
      Loading...
    </div>

    <button id="logoutButton">
      Logout
    </button>

  </div>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    const supabaseClient =
      window.supabase.createClient(
        "https://ivgvutsvtmwzoxuhijhi.supabase.co",
        "sb_publishable_n27G40Ccbw2vyU8DsX0yuw_yo-sRodl"
      );


    async function loadUser() {

      const { data } =
        await supabaseClient.auth.getUser();

      const user = data.user;


      if (!user) {

        window.location.href = "index.html";

        return;
      }


      document.getElementById("userEmail").textContent =
        user.email;


      const { data: profile } =
        await supabaseClient
          .from("profiles")
          .select("*")
          .eq("id", user.id)
          .maybeSingle();


      if (!profile) {

        await supabaseClient
          .from("profiles")
          .insert({
            id: user.id,
            email: user.email
          });

      }

    }


    document.getElementById("logoutButton").onclick =
      async function () {

        await supabaseClient.auth.signOut();

        window.location.href = "index.html";

      };


    loadUser();

  </script>

</body>
</html>
